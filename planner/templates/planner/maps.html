{% load static %}<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ scenario.name }} · Maps</title>
<link rel="stylesheet" href="{% static 'planner/vendor/leaflet.css' %}">
<link rel="stylesheet" href="{% static 'planner/planner.css' %}?v=20261120b">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #eef1f6; font-family: Inter, system-ui, Arial, sans-serif; overflow: hidden; }
  .mbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 10px; background: #1f2a44; color: #fff; font-size: 12.5px; }
  .mbar a.back { color: #cfd6e6; text-decoration: none; font-weight: 600; margin-right: 4px; }
  .mbar .ttl { font-weight: 700; margin-right: 6px; white-space: nowrap; }
  .mbar select { max-width: 190px; font-size: 12.5px; padding: 3px 6px; border-radius: 6px; border: 0; }
  .mbar .lbl { color: #9fb0d3; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }
  .mbar .ops { background: #fff; color: #1f2a44; border-radius: 8px; padding: 2px 6px; }
  .mbar .maptog label { margin-right: 8px; cursor: pointer; white-space: nowrap; }
  .mbar .sep { width: 1px; align-self: stretch; background: #3a4766; margin: 0 2px; }
  .mbar .status { margin-left: auto; color: #cfd6e6; font-size: 12px; white-space: nowrap; }
  .mbar button.reset { background: transparent; border: 1px solid #5a6a8e; color: #fff; border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
  #grid { flex: 1; display: grid; gap: 4px; padding: 4px; min-height: 0; }
  #grid.n1 { grid-template-columns: 1fr; } #grid.n2 { grid-template-columns: 1fr 1fr; } #grid.n3 { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 900px) { #grid.n2, #grid.n3 { grid-template-columns: 1fr; } }
  .mbox { position: relative; min-height: 0; min-width: 0; border-radius: 8px; overflow: hidden; background: #fff; }
  .mbox.hidden { display: none; }
  .mbox .map { position: absolute; inset: 0; }
  .mbox .maptitle { position: absolute; z-index: 800; left: 54px; top: 10px; }
  .mfind input { width: 230px; padding: 4px 8px; border-radius: 6px; border: 0; font-size: 12.5px; }
  .mfind .areahits { left: 0; right: auto; width: 440px; color: #1f2a44; z-index: 3000; }
</style>
</head>
<body>
<div class="mbar">
  <a class="back" href="{% url 'planner' scenario.pk %}" title="Back to the planner">← Planner</a>
  <span class="ttl">{{ scenario.name }}</span>
  <span class="sitefind mfind"><input id="mFind" placeholder="🔍 Site ID or franchise ID" autocomplete="off"><div id="mHits" class="areahits hidden"></div></span>
  <span class="sep"></span>
  <span class="lbl">Maps</span>
  <span class="maptog" id="mapTog"></span>
  <span class="sep"></span>
  <span id="companyCtl"></span>
  <span class="sep"></span>
  <span class="lbl">Hierarchy</span>
  <select id="fBig" title="Big Region"></select>
  <select id="fRegion" title="Region"></select>
  <select id="fBm" title="BM"></select>
  <select id="fArm" title="ASM"></select>
  <select id="fDistrict" title="District"></select>
  <select id="fCity" title="City"></select>
  <button class="reset" id="fReset" title="Clear all filters">Reset</button>
  <span class="status" id="status">Loading…</span>
</div>
<div id="grid" class="n3"
     data-scenario="{{ scenario.pk }}" data-base="{{ scenario.base }}" data-circle="{{ circle }}"></div>
<script src="{% static 'planner/vendor/leaflet.js' %}"></script>
<script src="{% static 'planner/sites.js' %}?v=20261120b"></script>
<script src="{% static 'planner/maps.js' %}?v=20261120b"></script>
</body></html>
